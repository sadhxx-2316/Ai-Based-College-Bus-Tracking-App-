version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: college_bus_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: college_bus_tracking
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - college_bus_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend & ML Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_bus_backend
    restart: always
    environment:
      - PROJECT_NAME=AI-Enabled College Bus Tracking and Smart ETA Prediction System
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=college_bus_tracking
      - JWT_SECRET=${JWT_SECRET:-college-bus-tracking-jwt-secret-key-2026-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - GOOGLE_MAPS_SERVER_KEY=${GOOGLE_MAPS_SERVER_KEY:-}
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173", "*"]
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - college_bus_net

  # ---------------------------------------------------------------------------
  # 3. Nginx + React Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_bus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - college_bus_net

volumes:
  mongodb_data:
    driver: local

networks:
  college_bus_net:
    driver: bridge
